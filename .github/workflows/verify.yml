name: verify

on:
  pull_request:
  push:
    branches: [main, feature/production-app-foundation]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run check:content
      - run: npm run check:launch

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: supabase db reset --local
      - run: supabase db lint --local --level error
