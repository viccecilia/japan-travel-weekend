root /var/www/japan-travel-weekend-test;
index index.html;
client_max_body_size 1m;

add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.stripe.com https://*.link.com https://*.googleusercontent.com https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://hzxoofvodpqpdomtmzlf.supabase.co wss://hzxoofvodpqpdomtmzlf.supabase.co https://api.stripe.com https://maps.googleapis.com https://places.googleapis.com https://link.com https://*.link.com; frame-src https://www.google.com https://maps.google.com https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com" always;

location /api-test/ {
    proxy_pass http://127.0.0.1:18773/;
    proxy_http_version 1.1;
    proxy_set_header Host api-test.japan-travel.info;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
}

location /assets/ {
    expires 1y;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
