worker_processes 1;
error_log stderr notice;
pid /tmp/jtw-nginx-validation.pid;

events { worker_connections 16; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server {
        listen 18080;
        listen [::]:18080;
        server_name weekend.japan-travel.info;
        include /tmp/jtw-weekend-test-common.conf;
    }
}
